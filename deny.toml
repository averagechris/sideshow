[licenses]
allow = [
  "Apache-2.0",
  # LLVM's standard permissive exception; used by cap-std's winx dependency.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # MPL-2.0 is file-level weak copyleft; accepted for the unmodified parser
  # crates in lol_html's dependency graph (cssparser, cssparser-macros,
  # dtoa-short, and selectors).
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
