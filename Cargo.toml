[package]
name = "sideshow"
version = "0.2.0"
edition = "2024"
description = "Agentic HTML slide deck compiler and toolkit"
authors = ["Christopher Cummings"]
license = "MIT OR Apache-2.0"
repository = "https://git.sr.ht/~averagechris/sideshow"
homepage = "https://git.sr.ht/~averagechris/sideshow"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "sideshow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
comrak = { version = "0.29", default-features = false }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lol_html = "2"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml = "0.8"
ureq = "2"
webp = "0.3.1"
which = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
