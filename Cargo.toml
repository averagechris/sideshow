[package]
name = "sideshow"
version = "0.4.0"
edition = "2024"
description = "Agentic HTML slide deck compiler and toolkit"
authors = ["Christopher Cummings"]
license = "MIT OR Apache-2.0"
repository = "https://git.sr.ht/~averagechris/sideshow"
homepage = "https://git.sr.ht/~averagechris/sideshow"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "sideshow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4"
clap = { version = "4", features = ["derive", "env"] }
comrak = { version = "0.29", default-features = false }
entities = "1"
flate2 = "1"
fs4 = "0.13"
getrandom = "0.4"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
libc = "0.2"
lol_html = "2"
notify = "8"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skera = "0.4.0"
tar = "0.4"
tempfile = "3"
toml = "0.8"
ureq = "2"
webp = "0.3.1"
which = "6"
write-fonts = { version = "0.50.0", features = ["read"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
