[package]
name = "sideshow"
version = "0.1.0"
edition = "2024"
description = "Agentic HTML slide deck compiler and toolkit"
authors = ["Christopher Cummings"]
license = "MIT"
repository = "https://git.sr.ht/~averagechris/sideshow"
homepage = "https://git.sr.ht/~averagechris/sideshow"
readme = "README.md"
categories = ["command-line-utilities"]

[[bin]]
name = "sideshow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
comrak = "0.29"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
webp = "0.3.1"
which = "6"

[dev-dependencies]
tempfile = "3"
