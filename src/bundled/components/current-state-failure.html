<section class="plan-shell semantic-component current-state-failure" data-intent="{{intent}}"><header class="plan-header"><div><p class="plan-eyebrow">{{eyebrow}}</p><h2 class="plan-title">{{title}}</h2></div><p class="plan-status" data-tone="{{tone}}">{{status}}</p></header><main class="plan-body failure-sequence"><article class="plan-card current-state"><h3>{{current_label}}</h3><p>{{current_body}}</p></article><article class="plan-card failure-mode"><h3>{{failure_label}}</h3><p>{{failure_body}}</p></article><article class="plan-card consequence"><h3>{{consequence_label}}</h3><p>{{consequence_body}}</p></article></main></section>
