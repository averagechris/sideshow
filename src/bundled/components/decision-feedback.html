<section class="plan-shell semantic-component decision-feedback" data-intent="{{intent}}"><header class="plan-header"><div><p class="plan-eyebrow">{{eyebrow}}</p><h2 class="plan-title">{{title}}</h2></div><p class="plan-status" data-tone="{{tone}}">{{status}}</p></header><main class="plan-body decision-request"><article class="plan-decision"><h3>{{decision_label}}</h3><p>{{decision}}</p></article><article class="plan-callout"><h3>{{request_label}}</h3><p>{{request}}</p></article></main></section>
